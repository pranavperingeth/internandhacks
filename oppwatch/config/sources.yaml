# Each source: name, type (rss | json_api | html), kind, enabled, plus type-specific keys.
sources:

  # ── RSS Sources ───────────────────────────────────────────────────────────

  - name: reddit_internships
    type: rss
    kind: internship
    enabled: true
    url: "https://www.reddit.com/r/internships/new/.rss"

  - name: reddit_hackathons
    type: rss
    kind: hackathon
    enabled: true
    url: "https://www.reddit.com/r/hackathon/new/.rss"

  - name: reddit_csmajors
    type: rss
    kind: internship
    enabled: true
    url: "https://www.reddit.com/r/csMajors/new/.rss"

  # ── JSON API Sources ─────────────────────────────────────────────────────

  # Devpost: upcoming hackathons (public API, no auth needed)
  - name: devpost_upcoming
    type: json_api
    kind: hackathon
    enabled: true
    url: "https://devpost.com/api/hackathons"
    params: { "status[]": "upcoming", "page": "1" }
    items_path: "hackathons"
    field_map:
      title: "title"
      url: "url"
      org: "organization_name"
      location: "displayed_location.location"
      deadline: "submission_period_dates"

  # Devpost: open hackathons (currently accepting submissions)
  - name: devpost_open
    type: json_api
    kind: hackathon
    enabled: true
    url: "https://devpost.com/api/hackathons"
    params: { "status[]": "open", "page": "1" }
    items_path: "hackathons"
    field_map:
      title: "title"
      url: "url"
      org: "organization_name"
      location: "displayed_location.location"
      deadline: "submission_period_dates"

  # Devfolio: hackathons with open applications (POST API)
  - name: devfolio_open
    type: json_api
    kind: hackathon
    enabled: true
    method: post
    url: "https://api.devfolio.co/api/search/hackathons"
    json_body: { "type": "application_open", "from": 0, "size": 20 }
    items_path: "hits.hits"
    url_template: "https://{}.devfolio.co/"
    field_map:
      title: "_source.name"
      url: "_source.slug"
      org: "_source.hosted_by"
      location: "_source.city"
      deadline: "_source.ends_at"
      description: "_source.tagline"

  # Hacker News Algolia: "Ask HN: Who is hiring" monthly threads
  - name: hn_who_is_hiring
    type: json_api
    kind: internship
    enabled: true
    url: "https://hn.algolia.com/api/v1/search_by_date"
    params: { "query": "Ask HN: Who is hiring", "tags": "story", "hitsPerPage": "5" }
    items_path: "hits"
    url_prefix: "https://news.ycombinator.com/item?id="
    field_map:
      title: "title"
      url: "objectID"
      org: "author"
      posted_at: "created_at"

  # SimplifyJobs: Curated internship list (GitHub JSON)
  - name: simplify_internships
    type: json_api
    kind: internship
    enabled: false             # Set true to ingest full GitHub listings repository (~17MB)
    url: "https://raw.githubusercontent.com/SimplifyJobs/Summer2025-Internships/dev/.github/scripts/listings.json"
    items_path: ""
    where: { "active": true, "is_visible": true }
    field_map:
      title: "title"
      url: "url"
      org: "company_name"
      location: "locations"
      posted_at: "date_posted"

  # ── HTML Scraper Template ────────────────────────────────────────────────

  # Template for a site without API or RSS. Only for plain-HTML pages (no JavaScript rendering).
  - name: example_html_site
    type: html
    kind: hackathon
    enabled: false
    url: "PASTE_PAGE_URL_HERE"
    item_selector: "PASTE_CSS_SELECTOR_FOR_ONE_LISTING"
    fields:
      title: "PASTE_SELECTOR"
      url: "PASTE_SELECTOR a"
      org: ""
      deadline: ""
